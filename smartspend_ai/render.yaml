services:
  - type: web
    name: smartspend-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SMARTSPEND_DB_PATH
        value: /var/data/smartspend.db
    # Attach a persistent disk mounted at /var/data for SQLite persistence.
